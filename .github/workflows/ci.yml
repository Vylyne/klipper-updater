name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint and type-check once, on a modern interpreter. Current mypy will not
  # even run on 3.9, so this cannot live in the test matrix.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor because that is what ships on the Raspberry Pi OS
        # release most printers run. Actually executing the suite there is the
        # real compatibility guarantee.
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  # The tool only ever runs on Linux, but it is developed on Windows, so the
  # test suite has to stay green there or the seams have stopped working.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q
