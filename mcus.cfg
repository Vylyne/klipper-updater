# Klipper Updater MCU registry.
#
# One [mcu <name>] section per board model. Lives here rather than in
# ~/mcus so it is backed up with the rest of your config and editable in
# Mainsail. Built firmware is NOT here - it goes in
# ~/printer_data/mcu-updater, because binaries have no business in a
# config directory that gets git-committed.
#
# Comments in this file survive edits made from the panel.

[mcu sv08Mainboard]
chipset: stm32f103xe
serials:
    36FFD9054755303923891357-if00

[mcu bttmmbv1]
chipset: stm32g0b1xx
serials:
    1F002A000A50304158373420-if00

[mcu bttebb36]
chipset: stm32g0b1xx
serials:
    290055001850304158373620-if00
    230048001750304158373620-if00

[mcu flylllplusbuffer]
chipset: stm32f072xb
klipper_makefile_patches:
    src/Makefile -> src-y += buffer.c
serials:
    4C0033000957465331323720-if00
    3F0037000957465331323720-if00
    440037000957465331323720-if00
    190031000957465331323720-if00
    400030000957465331323720-if00
    2B0038000957465331323720-if00
