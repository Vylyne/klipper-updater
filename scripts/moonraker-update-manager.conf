# Appended to ~/printer_data/config/moonraker.conf by install.sh.
# Lets Mainsail's Update Manager panel show and update klipper-updater.
#
# No `virtualenv:` or `requirements:` keys, because there are no dependencies -
# the agent runs on the system python3 with nothing but the standard library.
# That is the payoff of the stdlib-only decision: nothing to rebuild after an OS
# upgrade, and nothing for the update manager to reinstall.

[update_manager klipper-updater]
type: git_repo
channel: dev
path: ~/klipper-updater
origin: https://github.com/Vylyne/klipper-updater.git
primary_branch: main
managed_services: klipper_updater_agent
install_script: install.sh
